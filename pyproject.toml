[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "incident-triage"
version = "0.1.0"
description = "Production Incident Triage and Runbook Assistant (UE24AM342AA5 Mini Project 08)"
readme = "README.md"
requires-python = ">=3.11"
# Only dependencies used by implemented code are listed; later phases add their own.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; tests deliberately build fake secrets at runtime.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
